name: Salute TV direct archive check
on:
  push:
    branches: [diagnostics/runner-preflight]
    paths: ['.github/workflows/tv-direct-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        build: [CP24168744-1.100.39-b22449, CP25015166-1.100.39-b22453]
    steps:
      - name: Verify official archive
        env:
          BUILD: ${{ matrix.build }}
        shell: bash
        run: |
          set -euo pipefail
          u="https://cdn.sberdevices.ru/cloud/fw/factory/release-$BUILD.zip"
          echo "URL: $u"
          f="$(mktemp "$RUNNER_TEMP/tv.XXXXXX")"
          trap 'rm -f "$f"' EXIT
          curl -fLsS --connect-timeout 10 --max-time 120 --max-filesize 1300000000 -o "$f" "$u"
          python3 -u - "$f" <<'PY'
          import os,sys,hashlib,zipfile
          p=sys.argv[1]
          n=os.path.getsize(p)
          with open(p,'rb') as f: h=hashlib.file_digest(f,'sha256').hexdigest()
          print('Downloaded bytes:',n)
          print('SHA256:',h)
          print('EXACT_MATCH:',n==1065749290 and h=='936463c639b0e199b3cf0fd54e8500f25f4b208eceea97bf85ab4fc840b5d082')
          with zipfile.ZipFile(p) as z: print('ZIP expanded bytes:',sum(i.file_size for i in z.infolist()))
          PY
