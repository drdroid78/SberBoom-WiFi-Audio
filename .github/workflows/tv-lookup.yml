name: Salute TV catalog lookup
on:
  push:
    branches: [diagnostics/runner-preflight]
    paths: ['.github/workflows/tv-lookup.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve public model links without downloading archives
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json,subprocess,urllib.parse,re
          base='https://sberdevices.ru'
          def records(path):
              print('Catalog request:',path,flush=True)
              s=subprocess.check_output(['curl','-fsSL','--connect-timeout','8','--max-time','20','-A','Mozilla/5.0','-H','Accept: application/json','-e',base+'/firmware_tv/',base+path])
              d=json.loads(s)
              return d if isinstance(d,list) else d['data']
          def norm(s): return re.sub('[^A-Z0-9]','',str(s).upper())
          brands=records('/strapi/list-brands')
          print('Catalog brand count:',len(brands))
          matches=[x for x in brands if 'SBER' in norm(x.get('name',''))]
          print('Matching brands:',[(x['id'],x['name']) for x in matches])
          assert matches,'No matching Sber brand'
          count=0
          for b in matches[:3]:
              rows=records('/strapi/list-firmwares?'+urllib.parse.urlencode({'list_brand':b['id'],'_limit':-1}))
              print('Catalog record count:',len(rows))
              for row in rows:
                  if norm(row.get('name',''))=='SDX32H3113':
                      print('MODEL_MATCH:',json.dumps({k:row.get(k) for k in ['name','date','link','platform']},ensure_ascii=False))
                      count+=1
          assert count,'No model found'
          PY
