name: Salute TV source discovery
on:
  push:
    branches: [diagnostics/runner-preflight]
    paths: ['.github/workflows/tv-source.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official public firmware catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, concurrent.futures
          from html.parser import HTMLParser
          base='https://sberdevices.ru/firmware_tv/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.geturl(),r.read(12_000_000).decode('utf-8','replace')
          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.scripts.append(a['src'])
          url,html=get(base)
          print('Catalog URL:',url,'length:',len(html))
          p=Parser();p.feed(html)
          print('Scripts:',p.scripts[:40])
          pattern=re.compile(r'(?i)SDX[-_]?32H3113|1[.]100[.]39|tv[-_]firmware|firmware_tv|firmwareTv|firmwareUrl|/api/[^\s"\x27<>]{1,160}')
          def inspect(pair):
              u,s=pair
              matches=list(pattern.finditer(s))
              if matches:
                  print('Source:',u,'matches:',len(matches))
                  for m in matches[:18]:
                      print(re.sub(r'\s+',' ',s[max(0,m.start()-100):m.end()+160])[:400])
          inspect((url,html))
          urls=list(dict.fromkeys(urllib.parse.urljoin(url,s) for s in p.scripts))
          urls=[u for u in urls if urllib.parse.urlparse(u).hostname and urllib.parse.urlparse(u).hostname.endswith(('sberdevices.ru','sberbank.ru'))][:35]
          def one(u):
              try: inspect(get(u))
              except Exception as e: print('Public script error:',u,str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: list(ex.map(one,urls))
          PY
